<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Belle Knits</title>
<style>
/* Served by the Web Service, same origin as the API, so the session
   cookie works. Deliberately plain: this is a tool, not a shop front. */
:root{
  --bg:#f5f3ef; --panel:#fff; --rule:#ddd8d0; --ink:#26231f; --muted:#6b6459;
  --accent:#8c4a52; --good:#3f6b4a; --warn:#a3671f; --bad:#a33b3b;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
h1,h2,h3{margin:0 0 .5em;font-weight:600;line-height:1.2}
h1{font-size:1.4rem} h2{font-size:1.1rem} h3{font-size:.95rem}
a{color:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

header{background:var(--ink);color:#f5f3ef;padding:12px 0}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
header strong{font-size:1rem;letter-spacing:.02em}
header button{background:none;border:1px solid #55504a;color:#f5f3ef;padding:7px 14px;border-radius:3px;cursor:pointer;font:inherit;font-size:.85rem}

nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--rule);background:var(--panel);padding:0 16px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:13px 14px;font:inherit;font-size:.9rem;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

main{padding:24px 0 60px}
section[hidden]{display:none}

.panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:18px;margin-bottom:16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--rule);border-radius:3px;background:#fff;color:var(--ink)}
textarea{min-height:80px;resize:vertical}
button.act{background:var(--accent);color:#fff;border:0;border-radius:3px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:none;border:1px solid var(--rule);color:var(--ink);border-radius:3px;padding:8px 14px;font:inherit;font-size:.85rem;cursor:pointer}
button.danger{color:var(--bad);border-color:#e3c9c9}

table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

.pill{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#eee;color:var(--muted)}
.p-in-stock,.p-delivered,.p-complete{background:#e8efe6;color:var(--good)}
.p-low,.p-new,.p-knitting{background:#f7ecdb;color:var(--warn)}
.p-out-of-stock,.p-cancelled,.p-declined{background:#f3e3e3;color:var(--bad)}

.msg{padding:11px 14px;border-radius:3px;margin-bottom:14px;font-size:.9rem;border:1px solid}
.msg-ok{background:#e8efe6;border-color:#c6d8c1;color:var(--good)}
.msg-bad{background:#f7e9e9;border-color:#e3c9c9;color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:14px}
.stat b{display:block;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

#login{max-width:340px;margin:60px auto}
.hint{font-size:.8rem;color:var(--muted);margin-top:6px}
</style>
</head>
<body>

<div id="login" class="panel" hidden>
  <h1>Belle Knits</h1>
  <p class="hint" style="margin-top:-.3em">Admin sign in</p>
  <div id="login-msg"></div>
  <form id="login-form">
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <p></p>
    <button class="act" type="submit" style="width:100%">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <strong>Belle Knits — Admin</strong>
      <button id="logout">Sign out</button>
    </div>
  </header>

  <nav class="tabs">
    <button data-tab="dash" aria-selected="true">Overview</button>
    <button data-tab="quotes" aria-selected="false">Quotes</button>
    <button data-tab="orders" aria-selected="false">Orders</button>
    <button data-tab="products" aria-selected="false">Products</button>
    <button data-tab="gallery" aria-selected="false">Gallery</button>
    <button data-tab="settings" aria-selected="false">Settings</button>
  </nav>

  <main class="wrap">
    <div id="msg"></div>

    <section id="dash">
      <h2>Overview</h2>
      <div class="stats" id="stats"></div>
    </section>

    <section id="quotes" hidden>
      <h2>Quote requests</h2>
      <div class="panel scroll"><table id="quotes-table"></table></div>
    </section>

    <section id="orders" hidden>
      <h2>Orders</h2>
      <div class="panel scroll"><table id="orders-table"></table></div>
    </section>

    <section id="products" hidden>
      <h2>Products</h2>
      <div class="panel">
        <h3>Add a product</h3>
        <form id="product-form">
          <div class="row">
            <div><label for="p-name">Name</label><input id="p-name" required></div>
            <div><label for="p-slug">Slug <span class="hint">url-safe, unique</span></label><input id="p-slug" required></div>
            <div><label for="p-cat">Category</label>
              <select id="p-cat"><option value="wool">Wool &amp; yarn</option><option value="equipment">Equipment</option><option value="finished">Finished piece</option></select>
            </div>
            <div><label for="p-price">Price (R)</label><input id="p-price" type="number" min="0" step="1" required></div>
            <div><label for="p-unit">Unit</label><input id="p-unit" placeholder="100g ball"></div>
            <div><label for="p-weight">Weight</label><input id="p-weight" placeholder="DK / 8 ply"></div>
            <div><label for="p-fibre">Fibre</label><input id="p-fibre" placeholder="100% merino wool"></div>
            <div><label for="p-metreage">Metreage</label><input id="p-metreage" placeholder="225 m"></div>
            <div><label for="p-colour">Colour</label><input id="p-colour"></div>
            <div><label for="p-stock">Stock</label>
              <select id="p-stock"><option value="in-stock">In stock</option><option value="low">Low stock</option><option value="made-to-order">Made to order</option><option value="out-of-stock">Out of stock</option></select>
            </div>
            <div><label for="p-image">Photograph</label><input id="p-image" type="file" accept="image/*"></div>
          </div>
          <p></p>
          <label for="p-blurb">Description</label><textarea id="p-blurb"></textarea>
          <p></p>
          <button class="act" type="submit">Add product</button>
        </form>
      </div>
      <div class="panel scroll"><table id="products-table"></table></div>
    </section>

    <section id="gallery" hidden>
      <h2>Gallery</h2>
      <div class="panel">
        <h3>Add a piece</h3>
        <form id="gallery-form">
          <div class="row">
            <div><label for="g-title">Title</label><input id="g-title" required></div>
            <div><label for="g-note">Note</label><input id="g-note" placeholder="Commission, 2025"></div>
            <div><label for="g-image">Photograph</label><input id="g-image" type="file" accept="image/*"></div>
          </div>
          <p></p>
          <button class="act" type="submit">Add to gallery</button>
        </form>
      </div>
      <div class="panel scroll"><table id="gallery-table"></table></div>
    </section>

    <section id="settings" hidden>
      <h2>Business details</h2>
      <div class="panel">
        <form id="settings-form"><div class="row" id="settings-fields"></div><p></p>
          <button class="act" type="submit">Save settings</button></form>
      </div>
    </section>
  </main>
</div>

<script>
/* Same-origin: the API is this service, so relative URLs and the
   session cookie both just work. */
const API = '/api';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rand = n => 'R' + Number(n || 0).toLocaleString('en-ZA');
const when = d => d ? new Date(d).toLocaleDateString('en-ZA', { day:'numeric', month:'short', year:'numeric' }) : '';

function notify(text, ok = true, target = '#msg') {
  $(target).innerHTML = `<div class="msg ${ok ? 'msg-ok' : 'msg-bad'}">${esc(text)}</div>`;
  if (ok) setTimeout(() => { $(target).innerHTML = ''; }, 4000);
}

async function api(path, options = {}) {
  const res = await fetch(API + path, {
    credentials: 'include',
    headers: options.body instanceof FormData ? {} : { 'Content-Type': 'application/json' },
    ...options
  });
  // A 401 anywhere else means the session lapsed. On the login call itself it
  // just means the password was wrong, so let the server's message through.
  if (res.status === 401 && path !== '/admin/login') {
    showLogin();
    throw new Error('Your session has expired. Please sign in again.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Something went wrong');
  return data;
}

/* ---- auth ---- */

function showLogin() { $('#login').hidden = false; $('#app').hidden = true; }
function showApp() { $('#login').hidden = true; $('#app').hidden = false; loadAll(); }

$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    await api('/admin/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
    $('#pw').value = '';
    $('#login-msg').innerHTML = '';
    showApp();
  } catch (err) { notify(err.message, false, '#login-msg'); }
});

$('#logout').addEventListener('click', async () => {
  await fetch(API + '/admin/logout', { method: 'POST', credentials: 'include' });
  showLogin();
});

/* ---- tabs ---- */

document.querySelectorAll('nav.tabs button').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('nav.tabs button').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
  document.querySelectorAll('main section').forEach(s => { s.hidden = s.id !== btn.dataset.tab; });
}));

/* ---- loaders ---- */

async function loadDash() {
  const d = await api('/admin/dashboard');
  const cells = [
    ['New quotes', d.quotes?.new || 0],
    ['Quoted', d.quotes?.quoted || 0],
    ['In progress', d.quotes?.['in-progress'] || 0],
    ['New orders', d.orders?.new || 0],
    ['Knitting', d.orders?.knitting || 0],
    ['Active products', d.activeProducts || 0]
  ];
  $('#stats').innerHTML = cells.map(([label, n]) =>
    `<div class="stat"><b>${n}</b><span>${esc(label)}</span></div>`).join('');
}

async function loadQuotes() {
  const rows = await api('/admin/quotes');
  const STATUSES = ['new','quoted','accepted','in-progress','complete','declined'];
  $('#quotes-table').innerHTML =
    `<thead><tr><th>Ref</th><th>Received</th><th>Customer</th><th>Wants</th><th>Status</th><th class="num">Quoted</th></tr></thead><tbody>` +
    (rows.length ? rows.map(q => `<tr>
      <td>${esc(q.reference_number)}</td>
      <td>${when(q.created_at)}</td>
      <td>${esc(q.name)}<br><span class="hint">${esc(q.email)}${q.phone ? ' · ' + esc(q.phone) : ''}</span></td>
      <td>${esc(q.item || '—')}<br><span class="hint">${esc((q.project || '').slice(0, 90))}${(q.project||'').length > 90 ? '…' : ''}</span></td>
      <td><select data-quote="${q.id}">${STATUSES.map(s =>
        `<option value="${s}"${s === q.status ? ' selected' : ''}>${s}</option>`).join('')}</select></td>
      <td class="num"><input style="width:90px" type="number" min="0" step="1" value="${q.quoted_amount ?? ''}" data-quote-amount="${q.id}"></td>
    </tr>`).join('') : '<tr><td colspan="6">No quote requests yet.</td></tr>') + '</tbody>';

  document.querySelectorAll('[data-quote]').forEach(sel => sel.addEventListener('change', async () => {
    try { await api('/admin/quotes/' + sel.dataset.quote, { method: 'PATCH', body: JSON.stringify({ status: sel.value }) });
      notify('Status updated'); loadDash(); } catch (e) { notify(e.message, false); }
  }));
  document.querySelectorAll('[data-quote-amount]').forEach(inp => inp.addEventListener('change', async () => {
    try { await api('/admin/quotes/' + inp.dataset.quoteAmount, { method: 'PATCH',
      body: JSON.stringify({ quoted_amount: inp.value === '' ? null : Number(inp.value) }) });
      notify('Quote amount saved'); } catch (e) { notify(e.message, false); }
  }));
}

async function loadOrders() {
  const rows = await api('/admin/orders');
  const STATUSES = ['new','paid','knitting','shipped','delivered','cancelled'];
  $('#orders-table').innerHTML =
    `<thead><tr><th>Ref</th><th>Placed</th><th>Customer</th><th>Items</th><th class="num">Total</th><th>Status</th></tr></thead><tbody>` +
    (rows.length ? rows.map(o => `<tr>
      <td>${esc(o.reference_number)}</td>
      <td>${when(o.created_at)}</td>
      <td>${esc(o.name)}<br><span class="hint">${esc(o.email)}</span></td>
      <td>${(o.items || []).map(i => esc(`${i.quantity} × ${i.name}`)).join('<br>')}</td>
      <td class="num">${rand(o.total)}</td>
      <td><select data-order="${o.id}">${STATUSES.map(s =>
        `<option value="${s}"${s === o.status ? ' selected' : ''}>${s}</option>`).join('')}</select></td>
    </tr>`).join('') : '<tr><td colspan="6">No orders yet.</td></tr>') + '</tbody>';

  document.querySelectorAll('[data-order]').forEach(sel => sel.addEventListener('change', async () => {
    try { await api('/admin/orders/' + sel.dataset.order, { method: 'PATCH', body: JSON.stringify({ status: sel.value }) });
      notify('Status updated'); loadDash(); } catch (e) { notify(e.message, false); }
  }));
}

async function loadProducts() {
  const rows = await api('/admin/products');
  const STOCK = ['in-stock','low','made-to-order','out-of-stock'];
  $('#products-table').innerHTML =
    `<thead><tr><th>Image</th><th>Name</th><th>Category</th><th class="num">Price</th><th>Stock</th><th>Live</th><th></th></tr></thead><tbody>` +
    rows.map(p => `<tr>
      <td>
        ${p.image ? `<img src="${esc(p.image)}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:3px;display:block;margin-bottom:6px">` : '<span class="hint" style="display:block;margin-bottom:6px">none</span>'}
        <input type="file" accept="image/*" data-pimage="${p.id}" style="font-size:.75rem;width:120px">
      </td>
      <td>${esc(p.name)}<br><span class="hint">${esc(p.slug)}</span></td>
      <td>${esc(p.category)}</td>
      <td class="num"><input style="width:90px" type="number" min="0" step="1" value="${Number(p.price)}" data-price="${p.id}"></td>
      <td><select data-stock="${p.id}">${STOCK.map(s =>
        `<option value="${s}"${s === p.stock ? ' selected' : ''}>${s}</option>`).join('')}</select></td>
      <td><input type="checkbox" data-active="${p.id}"${p.active ? ' checked' : ''}></td>
      <td><button class="ghost danger" data-remove="${p.id}">Remove</button></td>
    </tr>`).join('') + '</tbody>';

  const patch = async (id, body, note) => {
    try { await api('/admin/products/' + id, { method: 'PATCH', body: JSON.stringify(body) }); notify(note); }
    catch (e) { notify(e.message, false); }
  };
  document.querySelectorAll('[data-price]').forEach(i =>
    i.addEventListener('change', () => patch(i.dataset.price, { price: Number(i.value) }, 'Price saved')));
  document.querySelectorAll('[data-stock]').forEach(s =>
    s.addEventListener('change', () => patch(s.dataset.stock, { stock: s.value }, 'Stock updated')));
  document.querySelectorAll('[data-active]').forEach(c =>
    c.addEventListener('change', () => patch(c.dataset.active, { active: c.checked }, c.checked ? 'Product is live' : 'Product hidden')));
  document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', async () => {
    try { await api('/admin/products/' + b.dataset.remove, { method: 'DELETE' }); notify('Product removed'); loadProducts(); }
    catch (e) { notify(e.message, false); }
  }));
  document.querySelectorAll('[data-pimage]').forEach(inp => inp.addEventListener('change', async () => {
    const file = inp.files[0];
    if (!file) return;
    const id = inp.dataset.pimage;
    try {
      const fd = new FormData();
      fd.append('image', file);
      const uploaded = await api('/admin/upload', { method: 'POST', body: fd });
      await api('/admin/products/' + id, { method: 'PATCH', body: JSON.stringify({ image: uploaded.url }) });
      notify('Product photo updated'); loadProducts();
    } catch (e) { notify(e.message, false); }
  }));
}

$('#product-form').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    let imageUrl = '';
    const file = $('#p-image').files[0];
    if (file) {
      const fd = new FormData();
      fd.append('image', file);
      const uploaded = await api('/admin/upload', { method: 'POST', body: fd });
      imageUrl = uploaded.url;
    }
    await api('/admin/products', { method: 'POST', body: JSON.stringify({
      name: $('#p-name').value, slug: $('#p-slug').value, category: $('#p-cat').value,
      price: Number($('#p-price').value), unit: $('#p-unit').value, weight: $('#p-weight').value,
      fibre: $('#p-fibre').value, metreage: $('#p-metreage').value, colour: $('#p-colour').value,
      stock: $('#p-stock').value, blurb: $('#p-blurb').value, image: imageUrl
    })});
    e.target.reset(); notify('Product added'); loadProducts(); loadDash();
  } catch (err) { notify(err.message, false); }
});

$('#p-name').addEventListener('blur', () => {
  if (!$('#p-slug').value) {
    $('#p-slug').value = $('#p-name').value.toLowerCase()
      .replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-').slice(0, 60);
  }
});

async function loadGallery() {
  const rows = await api('/admin/gallery');
  $('#gallery-table').innerHTML =
    `<thead><tr><th>Image</th><th>Title</th><th>Note</th><th>Live</th><th></th></tr></thead><tbody>` +
    rows.map(g => `<tr>
      <td>
        ${g.image ? `<img src="${esc(g.image)}" alt="" style="width:56px;height:56px;object-fit:cover;border-radius:3px;display:block;margin-bottom:6px">` : '<span class="hint" style="display:block;margin-bottom:6px">none</span>'}
        <input type="file" accept="image/*" data-gimage="${g.id}" style="font-size:.75rem;width:120px">
      </td>
      <td>${esc(g.title)}</td><td>${esc(g.note || '')}</td>
      <td><input type="checkbox" data-gactive="${g.id}"${g.active ? ' checked' : ''}></td>
      <td><button class="ghost danger" data-gremove="${g.id}">Delete</button></td>
    </tr>`).join('') + '</tbody>';

  document.querySelectorAll('[data-gactive]').forEach(c => c.addEventListener('change', async () => {
    try { await api('/admin/gallery/' + c.dataset.gactive, { method: 'PATCH', body: JSON.stringify({ active: c.checked }) });
      notify('Gallery updated'); } catch (e) { notify(e.message, false); }
  }));
  document.querySelectorAll('[data-gremove]').forEach(b => b.addEventListener('click', async () => {
    try { await api('/admin/gallery/' + b.dataset.gremove, { method: 'DELETE' }); notify('Deleted'); loadGallery(); }
    catch (e) { notify(e.message, false); }
  }));
  document.querySelectorAll('[data-gimage]').forEach(inp => inp.addEventListener('change', async () => {
    const file = inp.files[0];
    if (!file) return;
    const id = inp.dataset.gimage;
    try {
      const fd = new FormData();
      fd.append('image', file);
      await api('/admin/gallery/' + id, { method: 'PATCH', body: fd });
      notify('Gallery photo updated'); loadGallery();
    } catch (e) { notify(e.message, false); }
  }));
}

$('#gallery-form').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData();
  fd.append('title', $('#g-title').value);
  fd.append('note', $('#g-note').value);
  if ($('#g-image').files[0]) fd.append('image', $('#g-image').files[0]);
  try { await api('/admin/gallery', { method: 'POST', body: fd }); e.target.reset(); notify('Added to gallery'); loadGallery(); }
  catch (err) { notify(err.message, false); }
});

async function loadSettings() {
  const s = await api('/settings');
  $('#settings-fields').innerHTML = Object.entries(s).map(([k, v]) =>
    `<div><label for="s-${esc(k)}">${esc(k.replace(/_/g, ' '))}</label>
     <input id="s-${esc(k)}" data-setting="${esc(k)}" value="${esc(v)}"></div>`).join('');
}

$('#settings-form').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {};
  document.querySelectorAll('[data-setting]').forEach(i => { body[i.dataset.setting] = i.value; });
  try { await api('/admin/settings', { method: 'PUT', body: JSON.stringify(body) }); notify('Settings saved'); }
  catch (err) { notify(err.message, false); }
});

function loadAll() {
  loadDash().catch(() => {});
  loadQuotes().catch(() => {});
  loadOrders().catch(() => {});
  loadProducts().catch(() => {});
  loadGallery().catch(() => {});
  loadSettings().catch(() => {});
}

// Existing session?
fetch(API + '/admin/session', { credentials: 'include' })
  .then(r => r.ok ? showApp() : showLogin())
  .catch(showLogin);
</script>
</body>
</html>
